name: Backend tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: credit_app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: credit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credit_app -d credit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://credit_app:test_password@localhost:5432/credit_test
      SECRET_KEY: ci-test-only-secret-key-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: DATABASE_URL="$TEST_DATABASE_URL" alembic check
      - run: docker build -t credit-api:test .
